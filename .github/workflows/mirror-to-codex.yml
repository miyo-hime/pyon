name: mirror to codex

on:
  push:
    branches: [main]
    tags: ['**']
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: clone gh as bare mirror
        run: git clone --mirror "https://github.com/${{ github.repository }}.git" repo.git

      - name: push branches + tags to codex
        working-directory: repo.git
        env:
          CODEX_PAT: ${{ secrets.CODEX_PAT }}
        run: |
          git push --prune \
            "https://chroma:${CODEX_PAT}@codex.kurobox.me/miyo-rin/pyon.git" \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
